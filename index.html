<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元朗震夏盃 人工智慧機械車挑戰賽2026 - 實時計分大螢幕</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --gold: #fbbf24;
      --silver: #e2e8f0;
      --bronze: #d97706;
      --red: #f43f5e;
      --blue: #3b82f6;
      --border: #334155;
      --green: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 2px solid var(--border);
    }
    h1 { font-size: 2.4rem; color: var(--primary); margin-bottom: 8px; letter-spacing: 1px; }
    .rules-badge {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1rem;
      font-weight: 600;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 24px;
    }
    @media (max-width: 1024px) {
      .grid-container { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }
    .card h2 {
      font-size: 1.4rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--gold);
    }
    /* 賽程列表 */
    .match-list {
      max-height: 740px;
      overflow-y: auto;
      padding-right: 8px;
    }
    .match-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 10px;
      background: #24344d;
      border-radius: 8px;
      border-left: 5px solid var(--primary);
    }
    .match-item.paused {
      background: #451a03;
      border-left-color: var(--gold);
      justify-content: center;
      font-weight: bold;
      color: #fef08a;
      padding: 16px;
      font-size: 1.05rem;
    }
    .match-info { font-size: 0.9rem; color: var(--text-muted); width: 95px; line-height: 1.4; }
    .teams {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.15rem;
      font-weight: bold;
    }
    .team-btn {
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .team-btn.red { border-left: 5px solid var(--red); }
    .team-btn.blue { border-left: 5px solid var(--blue); }
    .team-btn.won { background: #15803d; color: #fff; border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    .team-btn.lost { background: #334155; color: #64748b; opacity: 0.6; }
    .match-actions { display: flex; gap: 6px; }
    .btn-action {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-action:hover { background: #475569; }
    .btn-reset { color: #f87171; }
    /* 排行榜表格 */
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--border);
    }
    th { color: var(--text-muted); font-size: 0.95rem; font-weight: 600; }
    td { font-size: 1.1rem; }
    .rank-row-1 { background: rgba(251, 191, 36, 0.1); }
    .rank-row-2 { background: rgba(226, 232, 240, 0.05); }
    .rank-row-3 { background: rgba(217, 119, 6, 0.05); }
    .rank-1 { color: var(--gold); font-weight: bold; font-size: 1.25rem; }
    .rank-2 { color: var(--silver); font-weight: bold; font-size: 1.15rem; }
    .rank-3 { color: var(--bronze); font-weight: bold; font-size: 1.15rem; }
    .score-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      background: #0284c7;
      color: white;
      font-weight: bold;
      font-size: 1.15rem;
    }
    .win-loss-tag {
      font-size: 0.95rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>🤖 元朗震夏盃 人工智慧機械車挑戰賽2026</h1>
    <div class="rules-badge">單循環 21 場 ｜ 勝方 3 分 ｜ 負方 1 分 ｜ 不設和局 (黃金加時 / 碰燈即時死亡)</div>
  </header>

  <div class="grid-container">
    <!-- 左側：21 場賽程操作列表 -->
    <div class="card">
      <h2>
        <span>⏱️ 賽程操作 (每場 6 分鐘)</span>
        <button class="btn-action btn-reset" onclick="resetAllData()">重置所有數據</button>
      </h2>
      <div class="match-list" id="matchContainer"></div>
    </div>

    <!-- 右側：獨立大尺寸積分排行榜 -->
    <div class="card">
      <h2>🏆 挑戰賽即時積分排行榜</h2>
      <table>
        <thead>
          <tr>
            <th style="width: 22%;">名次</th>
            <th style="width: 30%;">隊伍名稱</th>
            <th style="width: 20%;">已賽進度</th>
            <th style="width: 28%;">總積分</th>
          </tr>
        </thead>
        <tbody id="leagueTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const TEAMS = [
      '真光A', '真光B', '真光C', '真光D',
      '光明英來A', '光明英來B', '光明英來C'
    ];

    // 21 場標準賽程設定
    const MATCHES = [
      { id: 1, time: '09:45-09:51', round: 1, t1: '真光A', t2: '光明英來B' },
      { id: 2, time: '09:51-09:57', round: 1, t1: '真光B', t2: '光明英來A' },
      { id: 3, time: '09:57-10:03', round: 1, t1: '真光C', t2: '真光D' },
      { id: 4, time: '10:03-10:09', round: 2, t1: '真光B', t2: '光明英來C' },
      { id: 5, time: '10:09-10:15', round: 2, t1: '真光C', t2: '光明英來B' },
      { id: 6, time: '10:15-10:21', round: 2, t1: '真光D', t2: '光明英來A' },
      { id: 7, time: '10:21-10:27', round: 3, t1: '真光C', t2: '真光A' },
      { id: 8, time: '10:27-10:33', round: 3, t1: '真光D', t2: '光明英來C' },
      { id: 9, time: '10:33-10:39', round: 3, t1: '光明英來A', t2: '光明英來B' },
      { id: 10, time: '10:39-10:45', round: 4, t1: '真光D', t2: '真光B' },
      { id: 11, time: '10:45-10:51', round: 4, t1: '光明英來A', t2: '真光A' },
      { id: 12, time: '10:51-10:57', round: 4, t1: '光明英來B', t2: '光明英來C' },
      { id: 13, time: '10:57-11:03', round: 5, t1: '光明英來A', t2: '真光C' },
      { id: 14, time: '11:03-11:09', round: 5, t1: '光明英來B', t2: '真光B' },
      { id: 15, time: '11:09-11:15', round: 5, t1: '光明英來C', t2: '真光A' },
      { id: 16, time: '11:15-11:21', round: 6, t1: '光明英來B', t2: '真光D' },
      { id: 17, time: '11:21-11:27', round: 6, t1: '光明英來C', t2: '真光C' },
      { id: 18, time: '11:27-11:33', round: 6, t1: '真光A', t2: '真光B' },
      { id: 'pause', isPause: true, time: '11:33-12:18', text: '🔥 第 6 輪賽後：全體 45 分鐘深度 AI 評分工作坊 (比賽暫停)' },
      { id: 19, time: '12:18-12:24', round: 7, t1: '真光A', t2: '真光D' },
      { id: 20, time: '12:24-12:30', round: 7, t1: '光明英來C', t2: '光明英來A' },
      { id: 21, time: '12:30-12:36', round: 7, t1: '真光B', t2: '真光C' }
    ];

    let matchResults = JSON.parse(localStorage.getItem('matchResults_v2') || '{}');

    function saveState() {
      localStorage.setItem('matchResults_v2', JSON.stringify(matchResults));
      renderTable();
    }

    function recordWinner(matchId, winnerTeam) {
      matchResults[matchId] = winnerTeam;
      saveState();
      renderMatches();
    }

    function clearMatch(matchId) {
      delete matchResults[matchId];
      saveState();
      renderMatches();
    }

    function resetAllData() {
      if (confirm('確定要清空所有賽事比分嗎？此操作不可逆！')) {
        matchResults = {};
        saveState();
        renderMatches();
      }
    }

    function renderMatches() {
      const container = document.getElementById('matchContainer');
      container.innerHTML = '';

      MATCHES.forEach(m => {
        if (m.isPause) {
          const pauseDiv = document.createElement('div');
          pauseDiv.className = 'match-item paused';
          pauseDiv.innerText = m.text;
          container.appendChild(pauseDiv);
          return;
        }

        const div = document.createElement('div');
        div.className = 'match-item';

        const winner = matchResults[m.id];
        const t1Class = winner === m.t1 ? 'won' : (winner ? 'lost' : '');
        const t2Class = winner === m.t2 ? 'won' : (winner ? 'lost' : '');

        div.innerHTML = `
          <div class="match-info">
            <div><strong>場 ${m.id}</strong> (第${m.round}輪)</div>
            <div>${m.time}</div>
          </div>
          <div class="teams">
            <button class="team-btn red ${t1Class}" onclick="recordWinner(${m.id}, '${m.t1}')">${m.t1}</button>
            <span style="font-size: 0.85rem; color: #64748b;">VS</span>
            <button class="team-btn blue ${t2Class}" onclick="recordWinner(${m.id}, '${m.t2}')">${m.t2}</button>
          </div>
          <div class="match-actions">
            ${winner ? `<button class="btn-action btn-reset" onclick="clearMatch(${m.id})">重設</button>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function calculateStats() {
      const stats = {};
      TEAMS.forEach(t => {
        stats[t] = { team: t, played: 0, won: 0, lost: 0, points: 0 };
      });

      Object.entries(matchResults).forEach(([mId, winner]) => {
        const m = MATCHES.find(x => x.id == mId);
        if (!m || !winner) return;

        const loser = winner === m.t1 ? m.t2 : m.t1;
        stats[winner].played += 1;
        stats[winner].won += 1;
        stats[winner].points += 3; // 勝方 3 分

        stats[loser].played += 1;
        stats[loser].lost += 1;
        stats[loser].points += 1; // 負方 1 分
      });

      // 排序：積分多優先，若同分勝場多優先
      return Object.values(stats).sort((a, b) => b.points - a.points || b.won - a.won);
    }

    function renderTable() {
      const stats = calculateStats();
      const leagueBody = document.getElementById('leagueTableBody');
      leagueBody.innerHTML = '';

      stats.forEach((s, idx) => {
        const tr = document.createElement('tr');
        if (idx === 0) tr.className = 'rank-row-1';
        else if (idx === 1) tr.className = 'rank-row-2';
        else if (idx === 2) tr.className = 'rank-row-3';

        let rankText = `第 ${idx + 1} 名`;
        let rankClass = '';
        if (idx === 0) { rankText = '👑 冠軍'; rankClass = 'rank-1'; }
        else if (idx === 1) { rankText = '🥈 亞軍'; rankClass = 'rank-2'; }
        else if (idx === 2) { rankText = '🥉 季軍'; rankClass = 'rank-3'; }

        tr.innerHTML = `
          <td class="${rankClass}">${rankText}</td>
          <td><strong>${s.team}</strong></td>
          <td>${s.played} / 6 <span class="win-loss-tag">(${s.won}勝 ${s.lost}負)</span></td>
          <td><span class="score-badge">${s.points} 分</span></td>
        `;
        leagueBody.appendChild(tr);
      });
    }

    // 初始化渲染
    renderMatches();
    renderTable();
  </script>
</body>
</html>
